[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoll-eg2"
version = "0.1.0"
description = "Resource-bounded Recoll and EmbeddingGemma 2 hybrid search service"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recoll-eg2 = "recoll_eg2.cli:main"

[tool.setuptools.packages.find]
include = ["recoll_eg2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
